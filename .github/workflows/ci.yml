name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Meme version que l'image Airflow et la config mypy (python_version = 3.11).
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies (lockfile gele)
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy (strict)
        run: >-
          uv run mypy --strict
          ingestion/ tests/ scripts/ dashboard/ streamlit/app.py azure/databricks/notebooks

      - name: Pytest
        run: uv run pytest
