[project]
name = "pipeline-data-climat-agriculture"
version = "0.1.0"
description = "Pipeline data end-to-end croisant donnees climatiques (Open-Meteo) et agricoles/hydriques (data.gov.ma) pour produire des indicateurs de secheresse et de potentiel solaire par region du Maroc."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "pandas>=2.1,<2.2",
    "openpyxl>=3.1",
    "psycopg2-binary>=2.9,<3",
    "sqlalchemy>=1.4.36,<2.0",
    "dbt-core>=1.8,<1.9",
    "dbt-postgres>=1.8,<1.9",
    "streamlit>=1.37",
    "pydeck>=0.9",
    "plotly>=5.22",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# `from pyspark.sql import functions as F` : alias conventionnel de PySpark.
"azure/databricks/notebooks/*.py" = ["N812"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["dbt_project/", "airflow/dags/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
