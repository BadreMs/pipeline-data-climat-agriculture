name: ${COMPOSE_PROJECT_NAME:-pipeline-data-climat-agriculture}

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR:-LocalExecutor}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_AIRFLOW_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    DBT_PROFILES_DIR: /opt/airflow/dbt_project
    # Noms alignes sur ingestion/config.py::Settings (pas de prefixe) : ces
    # variables sont lues directement par Settings() dans le conteneur Airflow.
    # POSTGRES_HOST/PORT sont les valeurs internes au reseau Docker (service
    # "postgres", port 5432) - independantes du port host (5433) de .env.
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DWH_DB: ${POSTGRES_DWH_DB}
    OPENMETEO_BASE_URL: ${OPENMETEO_BASE_URL}
    OPENMETEO_START_DATE: ${OPENMETEO_START_DATE}
    OPENMETEO_END_DATE: ${OPENMETEO_END_DATE}
    DATAGOVMA_AGRICULTURE_URL: ${DATAGOVMA_AGRICULTURE_URL}
    DATAGOVMA_IRRIGATION_URL: ${DATAGOVMA_IRRIGATION_URL}
    DATAGOVMA_BARRAGES_URL: ${DATAGOVMA_BARRAGES_URL}
    DATAGOVMA_USE_MOCK_FALLBACK: ${DATAGOVMA_USE_MOCK_FALLBACK:-true}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/scripts:/opt/airflow/scripts
    - ./ingestion:/opt/airflow/project/ingestion
    - ./dbt_project:/opt/airflow/dbt_project
    - airflow_logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DWH_DB}
      POSTGRES_AIRFLOW_DB: ${POSTGRES_AIRFLOW_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DWH_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    profiles: ["tools"]
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - postgres

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - "airflow db migrate && airflow users create --username ${AIRFLOW__WEBSERVER__DEFAULT_USER_USERNAME:-admin} --password ${AIRFLOW__WEBSERVER__DEFAULT_USER_PASSWORD:-admin} --firstname Admin --lastname User --role Admin --email admin@example.com || true"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  airflow_logs:
